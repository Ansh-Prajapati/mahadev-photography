<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mahadev Photography</title>
    <link rel="stylesheet" href="../css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        
        .stat-card .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: white;
        }
        
        .stat-card .stat-icon.blue {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
        }
        
        .stat-card .stat-icon.green {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }
        
        .stat-card .stat-icon.orange {
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
        }
        
        .stat-card .stat-icon.red {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }
        
        .stat-card .stat-number {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
        }
        
        .stat-card .stat-label {
            color: #b8b8b8;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .admin-table-wrapper {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow-x: auto;
        }
        
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .admin-table th {
            text-align: left;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.02);
            color: #b8b8b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .admin-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #ffffff;
        }
        
        .admin-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-new {
            background: #e74c3c;
            color: white;
        }
        
        .badge-read {
            background: #2ecc71;
            color: white;
        }
        
        .badge-replied {
            background: #3498db;
            color: white;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .table-header h3 {
            color: #ffffff;
            font-size: 1.2rem;
            margin: 0;
        }
        
        .table-header h3 i {
            color: #D4AF37;
            margin-right: 10px;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: #1a1a1a;
            padding: 20px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .admin-header h1 {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: 700;
            margin: 0;
        }
        
        .admin-header h1 i {
            color: #D4AF37;
            margin-right: 12px;
        }
        
        .admin-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .admin-user .user-info {
            text-align: right;
        }
        
        .admin-user .user-info .user-name {
            font-weight: 600;
            color: #ffffff;
            font-size: 0.95rem;
        }
        
        .admin-user .user-info .user-role {
            font-size: 0.8rem;
            color: #b8b8b8;
        }
        
        .admin-user .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #D4AF37, #B8960F);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0A0A0A;
            font-weight: 700;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-camera"></i></div>
                <h3>Admin</h3>
                <span>Mahadev Photography</span>
            </div>
            <nav class="admin-nav">
                <a href="index.html" class="active"><i class="fas fa-dashboard"></i> <span>Dashboard</span></a>
                <a href="packages.html"><i class="fas fa-box"></i> <span>Packages</span></a>
                <a href="gallery.html"><i class="fas fa-photo-video"></i> <span>Gallery</span></a>
                <a href="submissions.html"><i class="fas fa-envelope"></i> <span>Submissions</span></a>
                <a href="#" class="logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <h1><i class="fas fa-dashboard"></i> Dashboard</h1>
                <div class="admin-user">
                    <div class="user-info">
                        <div class="user-name" id="adminName">Admin</div>
                        <div class="user-role">Administrator</div>
                    </div>
                    <div class="user-avatar">A</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fas fa-images"></i></div>
                    <div class="stat-number" id="statPortfolio">0</div>
                    <div class="stat-label">Gallery Images</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fas fa-box"></i></div>
                    <div class="stat-number" id="statPackages">0</div>
                    <div class="stat-label">Packages</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange"><i class="fas fa-envelope"></i></div>
                    <div class="stat-number" id="statSubmissions">0</div>
                    <div class="stat-label">Submissions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red"><i class="fas fa-rupee-sign"></i></div>
                    <div class="stat-number" id="statRevenue">₹0</div>
                    <div class="stat-label">Total Revenue</div>
                </div>
            </div>

            <div class="admin-table-wrapper">
                <div class="table-header">
                    <h3><i class="fas fa-clock"></i> Recent Submissions</h3>
                    <span style="color:#666;font-size:0.85rem;">Latest 5</span>
                </div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="recentSubmissions">
                        <tr>
                            <td colspan="4" style="text-align:center;color:#666;padding:30px;">
                                <i class="fas fa-spinner fa-spin"></i> Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/script.js"></script>
</body>

</html>
