<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions - Admin</title>
    <link rel="stylesheet" href="../css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-camera"></i></div>
                <h3>Admin</h3>
                <span>Mahadev Photography</span>
            </div>
            <nav class="admin-nav">
                <a href="index.html"><i class="fas fa-dashboard"></i> <span>Dashboard</span></a>
                <a href="packages.html"><i class="fas fa-box"></i> <span>Packages</span></a>
                <a href="gallery.html"><i class="fas fa-photo-video"></i> <span>Gallery</span></a>
                <a href="submissions.html" class="active"><i class="fas fa-envelope"></i> <span>Submissions</span></a>
                <a href="#" class="logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <h1><i class="fas fa-envelope"></i> Contact Submissions</h1>
                <button class="btn btn-primary" id="markAllRead"><i class="fas fa-check-double"></i> Mark All Read</button>
            </div>

            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Service</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="submissionsTable"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/script.js"></script>
</body>

</html>
