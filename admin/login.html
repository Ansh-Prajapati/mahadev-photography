<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Mahadev Photography</title>
    <link rel="stylesheet" href="../css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0A0A0A;
            padding: 20px;
        }
        .login-box {
            background: #1A1A1A;
            padding: 40px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(212,175,55,0.15);
        }
        .login-box .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-box .logo .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #D4AF37, #B8960F);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 1.8rem;
            color: #0A0A0A;
        }
        .login-box .logo h2 {
            color: #ffffff;
            font-family: 'Playfair Display', serif;
            margin: 0;
        }
        .login-box .logo p {
            color: #888;
            font-size: 0.9rem;
            margin: 5px 0 0;
        }
        .login-box .form-group {
            margin-bottom: 18px;
        }
        .login-box .form-group label {
            display: block;
            color: #b8b8b8;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .login-box .form-group label i {
            color: #D4AF37;
            margin-right: 6px;
        }
        .login-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(255,255,255,0.02);
            color: #ffffff;
            transition: 0.3s;
        }
        .login-box .form-group input:focus {
            border-color: #D4AF37;
            outline: none;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.06);
        }
        .login-box .btn {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 8px;
            background: linear-gradient(135deg, #D4AF37, #B8960F);
            color: #0A0A0A;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-box .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(212,175,55,0.3);
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: #666;
            font-size: 0.8rem;
        }
        .login-footer i { color: #D4AF37; }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 9999;
            animation: slideIn 0.5s ease;
        }
        .toast.success { background: #2ecc71; color: #0A0A0A; }
        .toast.error { background: #e74c3c; color: white; }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="admin-login">
        <div class="login-box">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-camera"></i></div>
                <h2>Admin Panel</h2>
                <p>Mahadev Photography</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" placeholder="admin@mahadevphotography.com" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>
            <div class="login-footer">
                <i class="fas fa-lock"></i> Secure Admin Access
            </div>
        </div>
    </div>

    <script>
        const API_URL = '../api/auth.php';

        function showToast(message, type) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                setTimeout(function() { toast.remove(); }, 500);
            }, 4000);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showToast('Please enter email and password.', 'error');
                return;
            }

            try {
                var response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                var result = await response.json();

                if (result.success) {
                    localStorage.setItem('adminToken', result.token);
                    localStorage.setItem('adminUser', JSON.stringify(result.user));
                    // Existing admin pages use this flag, while newer pages
                    // use adminToken. Set both during the transition.
                    localStorage.setItem('adminAuth', 'true');
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showToast(result.error || 'Invalid credentials', 'error');
                }
            } catch (error) {
                showToast('Connection error. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
