<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Packages - Admin</title>
    <link rel="stylesheet" href="../css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-camera"></i></div>
                <h3>Admin</h3>
                <span>Mahadev Photography</span>
            </div>
            <nav class="admin-nav">
                <a href="index.html"><i class="fas fa-dashboard"></i> <span>Dashboard</span></a>
                <a href="packages.html" class="active"><i class="fas fa-box"></i> <span>Packages</span></a>
                <a href="gallery.html"><i class="fas fa-photo-video"></i> <span>Gallery</span></a>
                <a href="submissions.html"><i class="fas fa-envelope"></i> <span>Submissions</span></a>
                <a href="#" class="logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <h1><i class="fas fa-box"></i> Manage Packages</h1>
                <button class="btn btn-primary" id="addPackageBtn"><i class="fas fa-plus"></i> Add Package</button>
            </div>

            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Features</th>
                            <th>Featured</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="packagesTable">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal" id="packageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Package</h2>
                <span class="modal-close">&times;</span>
            </div>
            <form id="packageForm" class="admin-form">
                <input type="hidden" id="packageId">
                <div class="form-group">
                    <label for="pkgName">Package Name <span class="required">*</span></label>
                    <input type="text" id="pkgName" placeholder="e.g., Gold Package" required>
                </div>
                <div class="form-group">
                    <label for="pkgPrice">Price (₹) <span class="required">*</span></label>
                    <input type="number" id="pkgPrice" placeholder="e.g., 29999" required>
                </div>
                <div class="form-group">
                    <label for="pkgFeatures">Features (one per line) <span class="required">*</span></label>
                    <textarea id="pkgFeatures" rows="4" placeholder="4 hours coverage&#10;100+ edited photos&#10;Online gallery" required></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="pkgFeatured"> Featured Package
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Save Package</button>
            </form>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>

</html>
